<style>
        body {
            background-color: #0A0A0B;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(22, 22, 24, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .neon-border-glow-blue:focus-within {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .shimmer-btn:hover::after {
            left: 100%;
            top: 100%;
        }

        .role-card.active {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-obsidian-base min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">

<!-- Main Container -->

<div class="mb-stack-md flex justify-center lg:justify-start">

</div>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary leading-tight">
                Empowering <span class="text-secondary">Cinematic</span> Vision.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto lg:mx-0">
                The ultimate collaborative hub for creators, studios, and production professionals. Precision technology at your fingertips.
            </p>
</div>
<!-- Right Side: Auth Portal -->
<div class="lg:col-span-7">
<div class="glass-panel rounded-3xl p-8 md:p-12 shadow-neon-blue-glow relative overflow-hidden transition-all duration-500">
<!-- Role Selection -->
<div class="mb-10">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-4 block">SELECT YOUR ROLE</label>
<div class="grid grid-cols-3 gap-4" id="role-selector">
<button class="role-card active glass-panel py-6 rounded-xl flex flex-col items-center space-y-2 transition-all duration-300 hover:scale-105 border border-glass-stroke" id="role-customer" onclick="selectRole('customer')">
<span class="material-symbols-outlined text-primary text-3xl">person</span>
<span class="font-label-caps text-[10px] tracking-widest text-on-surface uppercase">Customer</span>
</button>
<button class="role-card glass-panel py-6 rounded-xl flex flex-col items-center space-y-2 transition-all duration-300 hover:scale-105 border border-glass-stroke" id="role-professional" onclick="selectRole('professional')">
<span class="material-symbols-outlined text-secondary text-3xl">camera</span>
<span class="font-label-caps text-[10px] tracking-widest text-on-surface uppercase">Professional</span>
</button>
<button class="role-card glass-panel py-6 rounded-xl flex flex-col items-center space-y-2 transition-all duration-300 hover:scale-105 border border-glass-stroke" id="role-studio" onclick="selectRole('studio')">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-3xl">business</span>
<span class="font-label-caps text-[10px] tracking-widest text-on-surface uppercase">Studio</span>
</button>
</div>
</div>
<!-- Auth Forms -->
<div class="transition-all duration-300" id="auth-content">
<form class="space-y-6" id="login-form">
<div class="space-y-4">
<!-- Email Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest rounded-lg border-b border-glass-stroke py-4 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary-container transition-all placeholder:text-outline/50 font-body-md rounded-t-lg" placeholder="Email Address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest rounded-lg border-b border-glass-stroke py-4 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary-container transition-all placeholder:text-outline/50 font-body-md rounded-t-lg" placeholder="Password" required="" type="password"/>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-caps text-[11px] text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="shimmer-btn w-full py-4 bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-headline-md rounded-xl shadow-lg transition-transform active:scale-95" id="submit-auth" type="submit">
                            SIGN IN
                        </button>
<!-- Social Logins -->
<div class="space-y-6 transition-opacity duration-300" id="social-auth-section">
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-glass-stroke"></div>
<span class="flex-shrink mx-4 text-outline font-label-caps text-[10px]">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-glass-stroke"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center space-x-2 py-3 px-4 glass-panel rounded-xl hover:bg-white/5 transition-colors group" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z" fill="currentColor"></path></svg>
<span class="font-body-md text-sm text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 px-4 glass-panel rounded-xl hover:bg-white/5 transition-colors group" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24"><path d="M12 2.04c-5.5 0-10 4.5-10 10 0 5 3.66 9.12 8.44 9.88v-6.99h-2.54v-2.89h2.54v-2.2c0-2.5 1.47-3.89 3.79-3.89 1.11 0 2.28.2 2.28.2v2.5h-1.28c-1.24 0-1.63.77-1.63 1.56v1.83h2.82l-.45 2.89h-2.37v6.99c4.78-.76 8.44-4.88 8.44-9.88 0-5.5-4.5-10-10-10z" fill="currentColor"></path></svg>
<span class="font-body-md text-sm text-on-surface">Facebook</span>
</button>
</div>
<!-- Mobile OTP option -->
<button class="w-full flex items-center justify-center space-x-2 py-3 border border-glass-stroke rounded-xl hover:border-primary/50 transition-all" id="otp-btn" type="button">
<span class="material-symbols-outlined text-primary text-xl">app_shortcut</span>
<span class="font-label-caps text-xs text-on-surface tracking-wider">SIGN IN WITH MOBILE OTP</span>
</button>
</div>
<!-- Switch Toggle -->
<div class="pt-6 text-center transition-all duration-300" id="toggle-wrapper">
<p class="font-body-md text-on-surface-variant" id="toggle-container">
                                Don't have an account? 
                                <button class="text-primary font-bold hover:underline ml-1" id="auth-toggle" onclick="toggleMode()" type="button">Sign up</button>
</p>
</div>
</form>
</div>
<!-- Subtle Decorative Accents -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary opacity-10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-48 h-48 bg-secondary opacity-10 blur-[100px] rounded-full pointer-events-none"></div>
</div>

</main>
<!-- Success Message Popover (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-panel px-8 py-4 rounded-full border border-primary/50 shadow-neon-blue-glow flex items-center space-x-3 opacity-0 translate-y-10 transition-all duration-500 pointer-events-none z-[100]" id="success-toast">
<span class="material-symbols-outlined text-primary">check_circle</span>
<span class="font-body-md text-primary" id="toast-text">Successfully authenticated. Welcome back.</span>
</div>
<script>
        let currentRole = 'customer';
        let isLogin = true;

        function selectRole(role) {
            currentRole = role;
            
            // UI Updates for Cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active');
            });
            document.getElementById(`role-${role}`).classList.add('active');

            // Logic to show/hide sections based on role
            const socialSection = document.getElementById('social-auth-section');
            const toggleWrapper = document.getElementById('toggle-wrapper');
            const formContainer = document.getElementById('auth-content');
            
            // Fade out
            formContainer.style.opacity = '0';
            formContainer.style.transform = 'translateY(10px)';

            setTimeout(() => {
                if (role === 'studio') {
                    socialSection.style.display = 'none';
                    // Re-enabled toggle for studios as requested to allow sign-up visibility
                    toggleWrapper.style.display = 'block';
                    // Studios can start in login mode
                    isLogin = true;
                } else {
                    socialSection.style.display = 'block';
                    toggleWrapper.style.display = 'block';
                }

                updateAuthTexts();
                
                // Fade in
                formContainer.style.opacity = '1';
                formContainer.style.transform = 'translateY(0)';
            }, 300);
        }

        function toggleMode() {
            if (currentRole === 'studio') {
                // Routing Studio sign-up to specialized portal
                window.location.href = '{{DATA:SCREEN:SCREEN_31}}';
                return;
            }
            isLogin = !isLogin;
            updateAuthTexts();
        }

        function updateAuthTexts() {
            const submitBtn = document.getElementById('submit-auth');
            const toggleContainer = document.getElementById('toggle-container');

            if (isLogin) {
                submitBtn.innerText = 'SIGN IN';
                toggleContainer.innerHTML = `Don't have an account? <button type='button' onclick='toggleMode()' id='auth-toggle' class='text-primary font-bold hover:underline ml-1'>Sign up</button>`;
            } else {
                submitBtn.innerText = 'CREATE ACCOUNT';
                toggleContainer.innerHTML = `Already have an account? <button type='button' onclick='toggleMode()' id='auth-toggle' class='text-primary font-bold hover:underline ml-1'>Sign in</button>`;
            }
        }

        // Dynamic Routing Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email    = e.target.querySelector('input[type="email"]').value.trim();
            const password = e.target.querySelector('input[type="password"]').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';

            // Clear previous errors
            showError('');
            const submitBtn = document.getElementById('submit-auth');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                const res  = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: currentRole }),
                });
                const data = await res.json();

                if (!data.ok) {
                    showError(data.error || 'Something went wrong. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    return;
                }

                // Success feedback
                const toast    = document.getElementById('success-toast');
                const toastText = document.getElementById('toast-text');
                toastText.innerText = isLogin
                    ? 'Successfully authenticated. Welcome back.'
                    : 'Account created successfully. Redirecting...';
                toast.classList.remove('opacity-0', 'translate-y-10');
                toast.classList.add('opacity-100', 'translate-y-0');

                setTimeout(() => {
                    if (data.user.role === 'studio') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1200);

            } catch (err) {
                showError('Network error. Please check your connection.');
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });

        function showError(msg) {
            let el = document.getElementById('auth-error');
            if (!el) {
                el = document.createElement('p');
                el.id = 'auth-error';
                el.className = 'text-center text-sm font-body-md';
                el.style.color = '#ffb4ab';
                const btn = document.getElementById('submit-auth');
                btn.parentNode.insertBefore(el, btn);
            }
            el.textContent = msg;
        }

        // OTP simulation
        document.getElementById('otp-btn').addEventListener('click', () => {
            const authContent = document.getElementById('auth-content');
            authContent.innerHTML = `
                <div class="space-y-6">
                    <h3 class="text-on-surface font-headline-md text-center">Verification Required</h3>
                    <p class="text-outline text-center text-sm">Enter the code sent to your mobile device.</p>
                    <div class="flex justify-between gap-2">
                        ${[1, 2, 3, 4, 5, 6].map(() => `<input type="text" maxlength="1" class="w-12 h-14 bg-surface-container-high rounded-lg border border-glass-stroke text-center text-primary font-bold text-xl focus:border-primary focus:outline-none">`).join('')}
                    </div>
                    <button onclick="handleOTPVerification()" class="shimmer-btn w-full py-4 bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-headline-md rounded-xl">VERIFY</button>
                    <button onclick="location.reload()" class="w-full py-4 glass-panel rounded-xl text-primary font-label-caps">CANCEL</button>
                </div>
            `;
        });

        function handleOTPVerification() {
            const toast = document.getElementById('success-toast');
            toast.classList.remove('opacity-0', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                if (currentRole === 'studio') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            }, 1200);
        }
        function toggleMode() {
    if (currentRole === 'studio') {
        window.location.href = 'admin.html';
        return;
    }
    isLogin = !isLogin;
    updateAuthTexts();
}
    </script>
</body></html>
