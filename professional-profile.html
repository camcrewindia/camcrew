<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Profile | CamCrew</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="tailwind-config.js"></script>
<link rel="stylesheet" href="styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  :root {
    --nb:  #141414;
    --ns:  #000000;
    --nl:  #1e1e1e;
    --nr:  6px 6px 14px var(--ns), -6px -6px 14px var(--nl);
    --nr-s:3px 3px 8px  var(--ns), -3px -3px 8px  var(--nl);
    --ni-s:inset 2px 2px 6px  var(--ns), inset -2px -2px 6px  var(--nl);
    --ac:  #00dbe9;
    --ac2: #ebb2ff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--nb);
    color: #dce4e5;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .page-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
  }

  /* ── Profile header ── */
  .profile-header {
    display: flex;
    align-items: flex-start;
    gap: 2.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .avatar-wrap { flex-shrink: 0; position: relative; }

  .avatar-ring {
    width: 5.5rem;
    height: 5.5rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #00dbe9, #ebb2ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    font-weight: 900;
    color: #001f22;
    box-shadow: 0 0 0 3px var(--nb), 0 0 0 5px rgba(0,219,233,0.4), var(--nr-s);
    overflow: hidden;
    position: relative;
  }

  @media (min-width: 500px) {
    .avatar-ring { width: 7rem; height: 7rem; font-size: 2.8rem; }
  }

  /* ── Avatar image ── */
  .avatar-ring img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
    border-radius: 50%;
  }

  /* ── Profile info ── */
  .profile-info { flex: 1; min-width: 0; }

  .profile-name {
    font-size: 1.5rem;
    font-weight: 900;
    color: #dce4e5;
    margin-bottom: 0.1rem;
    line-height: 1.2;
    word-break: break-word;
  }

  .profile-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ac);
    margin-bottom: 0.75rem;
  }

  /* ── Stats row ── */
  .stats-row {
    display: flex;
    gap: 1.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .stat-item { text-align: center; }
  .stat-num  { font-size: 1.15rem; font-weight: 900; color: #dce4e5; display: block; }
  .stat-lbl  { font-size: 0.72rem; font-weight: 700; color: #849495; text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── Bio ── */
  .profile-bio {
    font-size: 0.875rem;
    color: #b0bdc0;
    line-height: 1.65;
    margin-bottom: 1rem;
    max-width: 420px;
    white-space: pre-wrap;
  }

  /* ── Category chips ── */
  .chips-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.28rem 0.75rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    background: rgba(0,219,233,0.1); color: var(--ac);
    border: 1px solid rgba(0,219,233,0.25);
  }

  /* ── Social links ── */
  .socials-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .social-link {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.32rem 0.85rem; border-radius: 999px;
    font-size: 0.76rem; font-weight: 700;
    background: var(--nb); box-shadow: var(--nr-s);
    color: #849495; text-decoration: none;
    transition: all 0.2s;
  }
  .social-link:hover { color: var(--ac); box-shadow: 0 0 10px rgba(0,219,233,0.2); }
  .social-link .material-symbols-outlined { font-size: 0.9rem; }

  /* ── Action buttons ── */
  .action-row { display: flex; gap: 0.65rem; flex-wrap: wrap; margin-bottom: 1rem; }

  .btn-dashboard {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.6rem 1.4rem; border-radius: 0.75rem;
    font-size: 0.85rem; font-weight: 800; cursor: pointer; border: none;
    background: linear-gradient(135deg, #00dbe9, #00b8c4);
    color: #001f22;
    box-shadow: var(--nr-s);
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-dashboard:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,219,233,0.35); }

  .btn-edit {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.6rem 1.2rem; border-radius: 0.75rem;
    font-size: 0.85rem; font-weight: 800; cursor: pointer; border: none;
    background: var(--nb); box-shadow: var(--nr-s);
    color: #dce4e5; text-decoration: none;
    transition: all 0.2s;
  }
  .btn-edit:hover { box-shadow: var(--nr); }

  /* ── Section heading ── */
  .section-divider {
    display: flex; align-items: center; gap: 0.75rem;
    margin: 2rem 0 1.25rem;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: #849495;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px;
    background: var(--ns); box-shadow: 0 1px 0 var(--nl);
  }

  /* ── Portfolio grid (Instagram 3-col) ── */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    border-radius: 0.85rem;
    overflow: hidden;
  }

  .portfolio-cell {
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
    cursor: pointer;
  }

  .portfolio-cell img,
  .portfolio-cell video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .portfolio-cell:hover img,
  .portfolio-cell:hover video { transform: scale(1.06); }

  .portfolio-cell .cell-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s;
  }
  .portfolio-cell:hover .cell-overlay { opacity: 1; }

  .portfolio-cell .cell-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem;
  }

  /* ── Services grid ── */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.85rem;
  }

  .service-card {
    background: var(--nb);
    border-radius: 1rem;
    padding: 1.1rem 1.2rem;
    box-shadow: var(--nr-s);
    display: flex; flex-direction: column; gap: 0.3rem;
  }

  .service-name { font-size: 0.9rem; font-weight: 800; color: #dce4e5; }
  .service-price { font-size: 0.82rem; font-weight: 700; color: var(--ac); }
  .service-desc { font-size: 0.78rem; color: #849495; line-height: 1.5; }

  /* ── Location pills ── */
  .location-chip {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.28rem 0.75rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 700;
    background: rgba(235,178,255,0.1); color: var(--ac2);
    border: 1px solid rgba(235,178,255,0.2);
  }

  /* ── Empty state ── */
  .grid-empty {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.65rem; padding: 3rem 2rem; text-align: center;
  }

  /* ── Member badge ── */
  .member-since {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.72rem; color: #849495; font-weight: 600;
    margin-bottom: 0.75rem;
  }

  /* ── Website ── */
  .website-link {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.82rem; color: var(--ac); font-weight: 700;
    text-decoration: none; margin-bottom: 0.75rem;
  }
  .website-link:hover { text-decoration: underline; }

  /* ── Lightbox ── */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-inner { position: relative; max-width: 820px; width: 100%; max-height: 90vh; }
  .lightbox-inner img, .lightbox-inner video {
    width: 100%; max-height: 80vh; object-fit: contain; border-radius: 0.75rem;
  }
  .lightbox-close {
    position: absolute; top: -2.5rem; right: 0;
    background: none; border: none; color: #dce4e5; cursor: pointer;
    font-size: 1.5rem; display: flex; align-items: center;
  }

  /* ── Light mode ── */
  html.light {
    --nb: #f0f4f5;
    --ns: rgba(0,0,0,0.1);
    --nl: rgba(255,255,255,0.9);
  }
  html.light body              { color: #0a1618; }
  html.light .profile-name     { color: #0a1618; }
  html.light .profile-bio      { color: #3a5052; }
  html.light .service-name     { color: #0a1618; }
  html.light .portfolio-cell   { background: rgba(0,0,0,0.06); }
  html.light .stat-num         { color: #0a1618; }

  /* ── Toast ── */
  #pp-toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,20,0.95); color: #dce4e5;
    border-radius: 999px; padding: 0.7rem 1.4rem;
    font-size: 0.85rem; font-weight: 700;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 400; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap;
  }
  #pp-toast.show { opacity: 1; }

  /* ── Loading skeleton ── */
  @keyframes shimmer { to { background-position: -200% center; } }
  .skel {
    border-radius: 0.5rem;
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
    background-size: 200%;
    animation: shimmer 1.5s infinite;
  }
</style>
</head>
<body>

<!-- ── CamCrew header ── -->
<div id="header-placeholder"></div>
<script src="header-loader.js"></script>

<!-- ── Main ── -->
<main class="page-wrap" id="profile-root">

  <!-- Loading skeleton -->
  <div id="skeleton">
    <div style="display:flex;gap:2.5rem;margin-bottom:2rem;flex-wrap:wrap;">
      <div class="skel" style="width:7rem;height:7rem;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:0.65rem;padding-top:0.5rem;">
        <div class="skel" style="height:1.6rem;max-width:220px;"></div>
        <div class="skel" style="height:1rem;max-width:160px;"></div>
        <div style="display:flex;gap:1.5rem;margin-top:0.25rem;">
          <div class="skel" style="height:2.5rem;width:60px;"></div>
          <div class="skel" style="height:2.5rem;width:60px;"></div>
          <div class="skel" style="height:2.5rem;width:60px;"></div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:0.85rem;overflow:hidden;">
      ${Array(6).fill('<div class="skel" style="aspect-ratio:1;"></div>').join('')}
    </div>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="profile-content" style="display:none;"></div>

</main>

<!-- ── Lightbox ── -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div id="lightbox-content"></div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="pp-toast"></div>

<!-- ── Footer ── -->
<div id="footer-placeholder"></div>
<script src="footer-loader.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   State & bootstrap
═══════════════════════════════════════════════════════════════════ */
const S = { user: null, pro: null, username: null };

(async function boot() {
  // Theme
  const theme = localStorage.getItem('cc-theme') || 'dark';
  document.documentElement.className = theme;

  // Load user from API
  try {
    const res  = await fetch('/api/me', { credentials: 'include' });
    const data = await res.json();
    if (data.ok) S.user = data.user;
  } catch (_) {}

  // Load professional profile from localStorage
  try {
    const raw = localStorage.getItem('cc_pro_profile');
    if (raw) S.pro = JSON.parse(raw);
  } catch (_) {}

  // Sync profile to server (creates/updates professional_profiles row + returns username)
  if (S.user?.role === 'professional') {
    try {
      const payload = {
        display_name:         S.user.display_name || S.pro?.name || '',
        title:                S.pro?.title        || '',
        bio:                  S.pro?.bio          || '',
        phone:                S.pro?.phone        || '',
        website:              S.pro?.website      || '',
        categories:           S.pro?.categories   || [],
        services:             S.pro?.services     || [],
        locations:            S.pro?.locations    || [],
        socials:              S.pro?.socials      || {},
        travel_international: S.pro?.travelIntl   || false,
      };
      const res  = await fetch('/api/profile', {
        method: 'PATCH', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.ok && data.username) S.username = data.username;
    } catch (_) {}
  }

  // Load vault for portfolio count
  let vaultFiles = [];
  try {
    const v = JSON.parse(localStorage.getItem('pro_vault') || '{"files":[]}');
    vaultFiles = v.files || [];
  } catch (_) {}

  // Load jobs for completed count
  let jobs = [];
  try { jobs = JSON.parse(localStorage.getItem('pro_jobs') || '[]'); } catch (_) {}

  render(vaultFiles, jobs);
})();

/* ═══════════════════════════════════════════════════════════════════
   Render
═══════════════════════════════════════════════════════════════════ */
function render(vaultFiles, jobs) {
  const skeleton = document.getElementById('skeleton');
  const content  = document.getElementById('profile-content');

  // Merge data sources
  const displayName  = S.user?.display_name || S.pro?.name || (S.user?.email?.split('@')[0]) || 'Professional';
  const title        = S.pro?.title        || '';
  const bio          = S.pro?.bio          || '';
  const categories   = S.pro?.categories   || [];
  const services     = S.pro?.services     || [];
  const locations    = S.pro?.locations    || [];
  const portfolio    = S.pro?.portfolio    || [];
  const socials      = S.pro?.socials      || {};
  const website      = S.pro?.website      || '';
  const joinedAt     = S.user?.created_at  || S.pro?.savedAt || '';

  // Stats
  const totalPortfolio = portfolio.length || vaultFiles.filter(f => ['image','video'].includes(f.type)).length;
  const completedJobs  = jobs.filter(j => j.status === 'completed').length;

  const initial = displayName.charAt(0).toUpperCase();

  // Avatar — use photo from pro profile if available
  const avatarPhoto = S.pro?.photo || null;
  const avatarHTML  = avatarPhoto
    ? `<img src="${esc(avatarPhoto)}" alt="${esc(displayName)}" onerror="this.remove()"/><span>${initial}</span>`
    : `<span>${initial}</span>`;

  // Member since
  const memberSince = joinedAt ? new Date(joinedAt).toLocaleDateString('en-US', { month:'short', year:'numeric' }) : '';

  /* ─ Portfolio grid ─ */
  const allMedia = portfolio.length ? portfolio : vaultFiles.filter(f => ['image','video'].includes(f.type));
  const gridCells = allMedia.length
    ? allMedia.map((item, i) => {
        const isVideo = item.type === 'video' || (item.isVideo);
        const url     = item.url || '';
        if (!url) {
          return `<div class="portfolio-cell">
            <div class="cell-placeholder">
              <span class="material-symbols-outlined" style="font-size:1.75rem;color:rgba(255,255,255,0.15);">${isVideo ? 'movie' : 'image'}</span>
            </div>
          </div>`;
        }
        return `<div class="portfolio-cell" onclick="openLightbox(${i})">
          ${isVideo
            ? `<video src="${esc(url)}" muted playsinline preload="metadata"
                 onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0"></video>`
            : `<img src="${esc(url)}" alt="Portfolio ${i+1}" loading="lazy"/>`}
          <div class="cell-overlay">
            <span class="material-symbols-outlined" style="color:#fff;font-size:1.5rem;">${isVideo ? 'play_circle' : 'zoom_in'}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="grid-empty">
        <span class="material-symbols-outlined" style="font-size:3rem;color:rgba(255,255,255,0.1);">photo_library</span>
        <p style="color:#849495;font-size:0.85rem;">No portfolio items yet.<br>Add media in Professional Setup.</p>
        <a href="professionalsetup.html" style="margin-top:0.5rem;font-size:0.8rem;color:var(--ac);font-weight:700;text-decoration:none;">Set up profile →</a>
      </div>`;

  /* ─ Services ─ */
  const servicesHTML = services.length
    ? `<div class="services-grid">
        ${services.map(s => `
          <div class="service-card">
            <p class="service-name">${esc(s.name)}</p>
            ${s.price ? `<p class="service-price">${fmtPrice(s)}</p>` : ''}
            ${s.desc  ? `<p class="service-desc">${esc(s.desc)}</p>` : ''}
          </div>`).join('')}
       </div>`
    : `<p style="color:#849495;font-size:0.85rem;">No services listed yet.</p>`;

  /* ─ Social links ─ */
  const socialDefs = [
    { key: 'instagram', icon: 'camera_alt',      label: 'Instagram', prefix: 'https://instagram.com/' },
    { key: 'facebook',  icon: 'thumb_up',         label: 'Facebook',  prefix: 'https://facebook.com/'  },
    { key: 'tiktok',    icon: 'music_video',      label: 'TikTok',    prefix: 'https://tiktok.com/@'   },
  ];
  const socialsHTML = socialDefs
    .filter(d => socials[d.key])
    .map(d => `
      <a href="${socials[d.key].startsWith('http') ? esc(socials[d.key]) : esc(d.prefix + socials[d.key])}"
         target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="material-symbols-outlined">${d.icon}</span>${d.label}
      </a>`).join('');

  /* ─ Render ─ */
  content.innerHTML = `
    <!-- Profile header -->
    <div class="profile-header">
      <div class="avatar-wrap">
        <div class="avatar-ring">${avatarHTML}</div>
      </div>

      <div class="profile-info">
        <!-- Action buttons -->
        <div class="action-row" style="margin-bottom:0.9rem;">
          <a href="professional-dashboard.html" class="btn-dashboard">
            <span class="material-symbols-outlined" style="font-size:1rem;">dashboard</span>
            Dashboard
          </a>
          <a href="professional-edit.html" class="btn-edit">
            <span class="material-symbols-outlined" style="font-size:1rem;">edit</span>
            Edit Profile
          </a>
          <a href="professionalsetup.html" class="btn-edit" title="Setup Wizard">
            <span class="material-symbols-outlined" style="font-size:1rem;">tune</span>
          </a>
        </div>

        <h1 class="profile-name">${esc(displayName)}</h1>
        ${S.username ? `<p style="font-size:0.85rem;font-weight:700;color:#849495;margin-bottom:0.3rem;letter-spacing:0.01em;">@${esc(S.username)}</p>` : ''}
        ${title ? `<p class="profile-title">${esc(title)}</p>` : ''}

        ${memberSince ? `<div class="member-since">
          <span class="material-symbols-outlined" style="font-size:0.85rem;">calendar_month</span>
          Member since ${memberSince}
        </div>` : ''}

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-num">${totalPortfolio}</span>
            <span class="stat-lbl">Portfolio</span>
          </div>
          <div class="stat-item">
            <span class="stat-num">${services.length}</span>
            <span class="stat-lbl">Services</span>
          </div>
          <div class="stat-item">
            <span class="stat-num">${completedJobs}</span>
            <span class="stat-lbl">Completed</span>
          </div>
          <div class="stat-item">
            <span class="stat-num">${locations.length}</span>
            <span class="stat-lbl">Cities</span>
          </div>
        </div>

        ${bio ? `<p class="profile-bio">${esc(bio)}</p>` : ''}

        ${website ? `<a href="${website.startsWith('http') ? esc(website) : 'https://' + esc(website)}"
          target="_blank" rel="noopener noreferrer" class="website-link">
          <span class="material-symbols-outlined" style="font-size:0.9rem;">link</span>
          ${esc(website.replace(/^https?:\/\//, ''))}
        </a>` : ''}

        ${categories.length ? `<div class="chips-row">
          ${categories.map(c => `<span class="chip">${esc(c)}</span>`).join('')}
        </div>` : ''}

        ${socialsHTML ? `<div class="socials-row">${socialsHTML}</div>` : ''}

        ${locations.length ? `<div class="chips-row">
          ${locations.map(l => `<span class="location-chip">
            <span class="material-symbols-outlined" style="font-size:0.75rem;">location_on</span>${esc(l)}
          </span>`).join('')}
        </div>` : ''}
      </div>
    </div>

    <!-- Portfolio grid -->
    <div class="section-divider">Portfolio</div>
    <div class="portfolio-grid" id="portfolio-grid">${gridCells}</div>

    <!-- Services -->
    <div class="section-divider">Services</div>
    ${servicesHTML}

    <!-- Share profile nudge -->
    <div class="section-divider">Share Profile</div>
    <div style="background:rgba(0,219,233,0.06);border:1px solid rgba(0,219,233,0.15);border-radius:1rem;padding:1.25rem 1.5rem;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:0.85rem;">
        <div>
          <p style="font-weight:700;font-size:0.9rem;margin-bottom:0.2rem;">Your public profile link</p>
          <p style="color:#849495;font-size:0.78rem;">Share this with clients — no login required to view it.</p>
        </div>
        <button onclick="copyProfileLink()" style="
          display:inline-flex;align-items:center;gap:0.45rem;
          padding:0.55rem 1.2rem;border-radius:0.75rem;border:none;cursor:pointer;
          background:rgba(0,219,233,0.15);color:var(--ac);font-weight:800;font-size:0.82rem;
          font-family:'Plus Jakarta Sans',sans-serif;transition:background 0.2s;flex-shrink:0;"
          onmouseover="this.style.background='rgba(0,219,233,0.25)'"
          onmouseout="this.style.background='rgba(0,219,233,0.15)'">
          <span class="material-symbols-outlined" style="font-size:1rem;">content_copy</span>
          Copy Link
        </button>
      </div>
      ${S.username ? `
      <div style="display:flex;align-items:center;gap:0.5rem;background:var(--nb);border-radius:0.65rem;padding:0.6rem 0.9rem;box-shadow:var(--ni-s);overflow:hidden;">
        <span class="material-symbols-outlined" style="font-size:1rem;color:#849495;flex-shrink:0;">link</span>
        <span style="font-size:0.82rem;color:var(--ac);font-weight:700;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(window.location.origin)}/@${esc(S.username)}</span>
      </div>` : `
      <p style="font-size:0.78rem;color:#849495;">Profile link will appear here once your profile data is saved.</p>`}
    </div>
  `;

  // Store media for lightbox
  window._lightboxMedia = allMedia;

  skeleton.style.display = 'none';
  content.style.display  = 'block';
}

/* ═══════════════════════════════════════════════════════════════════
   Lightbox
═══════════════════════════════════════════════════════════════════ */
function openLightbox(idx) {
  const media = (window._lightboxMedia || [])[idx];
  if (!media || !media.url) return;
  const isVideo = media.type === 'video' || media.isVideo;
  const lb = document.getElementById('lightbox-content');
  lb.innerHTML = isVideo
    ? `<video src="${esc(media.url)}" controls autoplay style="width:100%;max-height:80vh;border-radius:0.75rem;"></video>`
    : `<img src="${esc(media.url)}" alt="Portfolio" style="width:100%;max-height:80vh;object-fit:contain;border-radius:0.75rem;"/>`;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  const lb = document.getElementById('lightbox-content');
  lb.innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

/* ═══════════════════════════════════════════════════════════════════
   Copy profile link
═══════════════════════════════════════════════════════════════════ */
function copyProfileLink() {
  const url = S.username
    ? window.location.origin + '/@' + S.username
    : window.location.origin + '/professional-profile.html';
  navigator.clipboard.writeText(url)
    .then(() => showToast(`Copied: ${url}`))
    .catch(() => showToast('Could not copy link.'));
}

/* ═══════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtPrice(s) {
  if (!s.price) return '';
  const unit = s.unit || 'project';
  const num  = Number(s.price).toLocaleString('en-IN');
  return `₹${num} / ${unit}`;
}

function showToast(msg) {
  const t = document.getElementById('pp-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Theme toggle
function toggleTheme() {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  document.documentElement.className = next;
  localStorage.setItem('cc-theme', next);
}
</script>

</body>
