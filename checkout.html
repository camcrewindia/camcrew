<!-- STITCH_SHADER_START:ANIMATION_6 class="absolute inset-0 w-full h-full opacity-40" -->
<div class="absolute inset-0 w-full h-full opacity-40" style="display:block;">
<canvas id="shader-canvas-ANIMATION_6" style="display:block;width:100%;height:100%" width="1300" height="5870"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_6');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    vec3 color1 = vec3(0.05, 0.08, 0.1); // Deep Obsidian
    vec3 color2 = vec3(0.0, 0.94, 1.0);  // Electric Blue
    vec3 color3 = vec3(0.74, 0.0, 1.0);  // Vibrant Purple
    
    float noise = sin(uv.x * 10.0 + u_time * 0.5) * cos(uv.y * 10.0 + u_time * 0.5);
    float glow = smoothstep(0.4, 0.6, sin(u_time * 0.2 + length(uv - 0.5) * 5.0) * 0.5 + 0.5);
    
    vec3 finalColor = mix(color1, color2, glow * 0.1);
    finalColor = mix(finalColor, color3, noise * 0.05);
    
    // Add floating particle "dust"
    float particles = pow(fract(sin(dot(uv + u_time * 0.01, vec2(12.9898, 78.233))) * 43758.5453), 20.0);
    finalColor += particles * 0.2;

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
        // ── Input micro-interactions ──────────────────────────────────────────
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // ── Complete Purchase button ──────────────────────────────────────────
        document.getElementById('complete-purchase-btn').addEventListener('click', function() {
            if (this.disabled) return;
            this.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite">progress_activity</span>&nbsp;Processing...';
            this.classList.add('opacity-80');
            this.disabled = true;
            setTimeout(() => {
                this.innerHTML = 'Payment Confirmed <span class="material-symbols-outlined">check_circle</span>';
                this.classList.replace('bg-primary-container', 'bg-green-500');
                this.classList.remove('neon-glow-primary');
            }, 2000);
        });

        // ── Load cart for order summary ───────────────────────────────────────
        function fmt(n) {
            return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        async function loadCheckoutSummary() {
            try {
                const res = await fetch('/api/cart');
                if (res.status === 401) {
                    document.getElementById('checkout-items-list').innerHTML =
                        `<p class="text-on-surface-variant text-body-md py-2">
                           <a href="signin.html" class="text-primary underline">Sign in</a> to view your cart.
                         </p>`;
                    return;
                }
                const data = await res.json();
                if (!data.ok || data.items.length === 0) {
                    document.getElementById('checkout-items-list').innerHTML =
                        `<p class="text-on-surface-variant text-body-md py-2">Your cart is empty. <a href="sales.html" class="text-primary underline">Shop now →</a></p>`;
                    return;
                }

                const list = document.getElementById('checkout-items-list');
                list.innerHTML = '';
                data.items.forEach(item => {
                    const lineTotal = item.price * item.quantity;
                    const imgEl = item.image_url
                        ? `<img class="w-full h-full object-cover" src="${item.image_url}" alt="${item.name}">`
                        : `<div class="w-full h-full flex items-center justify-center text-on-surface-variant"><span class="material-symbols-outlined">photo_camera</span></div>`;
                    const row = document.createElement('div');
                    row.className = 'flex gap-4';
                    row.innerHTML = `
                        <div class="w-20 h-20 bg-surface-container rounded-lg border border-glass-stroke overflow-hidden flex-shrink-0">
                            ${imgEl}
                        </div>
                        <div class="flex-grow">
                            <h4 class="text-body-md font-bold text-on-surface leading-tight">${item.name}</h4>
                            ${item.category ? `<p class="text-label-caps text-on-surface-variant uppercase mt-1">${item.category}</p>` : ''}
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-on-surface-variant font-body-md">Qty: ${item.quantity}</span>
                                <span class="text-primary font-bold">${fmt(lineTotal)}</span>
                            </div>
                        </div>`;
                    list.appendChild(row);
                });

                const subtotal = data.subtotal;
                const tax = subtotal * 0.08875;
                const total = subtotal + tax;
                document.getElementById('checkout-subtotal').textContent = fmt(subtotal);
                document.getElementById('checkout-tax').textContent = fmt(tax);
                document.getElementById('checkout-total').textContent = fmt(total);

                const btn = document.getElementById('complete-purchase-btn');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            } catch (e) {
                document.getElementById('checkout-items-list').innerHTML =
                    `<p class="text-on-surface-variant text-body-md py-2">Could not load cart.</p>`;
            }
        }

        loadCheckoutSummary();
    </script>
