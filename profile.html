<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Camcrew Studio | My Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="tailwind-config.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="font-body-md antialiased min-h-screen flex flex-col">

<!-- Animated Background (same WebGL shader as index.html) -->
<div class="fixed inset-0 z-[-1] overflow-hidden">
    <div class="absolute inset-0 w-full h-full opacity-40">
        <canvas id="shader-canvas" style="display:block;width:100%;height:100%"></canvas>
        <script>
        (function() {
            const canvas = document.getElementById('shader-canvas');
            function syncSize() {
                const w = canvas.clientWidth  || 1280;
                const h = canvas.clientHeight || 720;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w; canvas.height = h;
                }
            }
            if (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncSize).observe(canvas);
            syncSize();
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;
            const vs = `attribute vec2 a_position; varying vec2 v_texCoord;
            void main() { v_texCoord = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }`;
            const fs = `precision highp float; varying vec2 v_texCoord; uniform float u_time; uniform vec2 u_resolution;
            void main() {
                vec2 uv = v_texCoord;
                vec3 color1 = vec3(0.05, 0.08, 0.1);
                vec3 color2 = vec3(0.0, 0.94, 1.0);
                vec3 color3 = vec3(0.74, 0.0, 1.0);
                float noise = sin(uv.x * 10.0 + u_time * 0.5) * cos(uv.y * 10.0 + u_time * 0.5);
                float glow = smoothstep(0.4, 0.6, sin(u_time * 0.2 + length(uv - 0.5) * 5.0) * 0.5 + 0.5);
                vec3 finalColor = mix(color1, color2, glow * 0.1);
                finalColor = mix(finalColor, color3, noise * 0.05);
                float particles = pow(fract(sin(dot(uv + u_time * 0.01, vec2(12.9898, 78.233))) * 43758.5453), 20.0);
                finalColor += particles * 0.2;
                gl_FragColor = vec4(finalColor, 1.0);
            }`;
            function cs(type, src) {
                const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s;
            }
            const prog = gl.createProgram();
            gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
            gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(prog); gl.useProgram(prog);
            const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            const pos = gl.getAttribLocation(prog, 'a_position');
            gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
            const uTime = gl.getUniformLocation(prog, 'u_time');
            const uRes  = gl.getUniformLocation(prog, 'u_resolution');
            let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
            window.addEventListener('mousemove', (e) => {
                const r = canvas.getBoundingClientRect();
                if (r.width && r.height) {
                    mouse.x = ((e.clientX - r.left) / r.width) * canvas.width;
                    mouse.y = (1.0 - (e.clientY - r.top) / r.height) * canvas.height;
                }
            });
            function render(t) {
                if (typeof ResizeObserver === 'undefined') syncSize();
                gl.viewport(0, 0, canvas.width, canvas.height);
                if (uTime) gl.uniform1f(uTime, t * 0.001);
                if (uRes)  gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render(0);
        })();
        </script>
    </div>
</div>

<!-- Navigation Header (exact replica of index.html nav) -->
<div id="site-header"></div>

<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop pt-32 pb-stack-xl">
    <div class="w-full max-w-2xl">

        <!-- Not-logged-in state (shown while loading or if unauthenticated) -->
        <div id="auth-gate" class="text-center py-20">
            <span class="material-symbols-outlined text-6xl text-on-surface-variant mb-4 block">lock</span>
            <p class="font-headline-md text-on-surface-variant mb-6">Sign in to view your profile</p>
            <a href="signin.html" class="shimmer-btn inline-block relative overflow-hidden bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-bold py-4 px-8 rounded-full text-label-caps transition-transform hover:scale-105">Go to Sign In</a>
        </div>

        <!-- Profile Card (hidden until auth loads) -->
        <div id="profile-card" style="display:none" class="reveal">

            <!-- Page heading -->
            <div class="mb-8 text-center">
                <p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.2em]">Account</p>
                <h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary mt-2">My Profile</h1>
            </div>

            <!-- Main glass card -->
            <div class="glass-panel rounded-3xl p-8 md:p-12 relative overflow-hidden">
                <!-- Decorative glows -->
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary opacity-10 blur-[100px] rounded-full pointer-events-none"></div>
                <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-secondary opacity-10 blur-[100px] rounded-full pointer-events-none"></div>

                <!-- Avatar + identity -->
                <div class="flex flex-col items-center mb-10">
                    <!-- Spinning conic gradient ring -->
                    <div class="avatar-ring w-24 h-24 mb-5">
                        <div class="avatar-inner">
                            <span id="avatar-initial" class="text-4xl font-bold text-primary" style="text-shadow: 0 0 20px rgba(0,240,255,0.8)"></span>
                        </div>
                    </div>
                    <div class="text-center">
                        <h2 id="profile-display-name" class="font-headline-md text-headline-md text-on-surface mb-1"></h2>
                        <p id="profile-email" class="font-body-md text-on-surface-variant text-sm"></p>
                    </div>
                    <!-- Role badge -->
                    <div class="mt-3 flex items-center gap-2">
                        <span id="profile-role-badge" class="flex items-center gap-1.5 font-label-caps text-[10px] uppercase tracking-widest bg-primary/10 text-primary-fixed-dim border border-primary/20 px-3 py-1 rounded-full">
                            <span class="material-symbols-outlined text-[14px]">verified</span>
                            <span id="profile-role-text"></span>
                        </span>
                    </div>
                </div>

                <!-- Stat cards row -->
                <div class="grid grid-cols-3 gap-gutter mb-10">
                    <div class="stat-card rounded-2xl p-4 text-center">
                        <span class="material-symbols-outlined text-primary text-2xl mb-1 block">calendar_month</span>
                        <p id="member-since" class="font-bold text-on-surface text-sm"></p>
                        <p class="font-label-caps text-[10px] text-on-surface-variant uppercase mt-1">Member Since</p>
                    </div>
                    <div class="stat-card rounded-2xl p-4 text-center">
                        <span class="material-symbols-outlined text-secondary text-2xl mb-1 block">videocam</span>
                        <p class="font-bold text-on-surface text-sm">0</p>
                        <p class="font-label-caps text-[10px] text-on-surface-variant uppercase mt-1">Sessions</p>
                    </div>
                    <div class="stat-card rounded-2xl p-4 text-center">
                        <span class="material-symbols-outlined text-primary-fixed-dim text-2xl mb-1 block">shopping_bag</span>
                        <p class="font-bold text-on-surface text-sm">0</p>
                        <p class="font-label-caps text-[10px] text-on-surface-variant uppercase mt-1">Bookings</p>
                    </div>
                </div>

                <!-- Edit display name -->
                <div class="space-y-6">
                    <label class="font-label-caps text-label-caps text-on-surface-variant block mb-4 uppercase tracking-widest">Edit Profile</label>

                    <!-- Display Name field -->
                    <div class="group relative">
                        <label class="block font-label-caps text-[10px] text-on-surface-variant mb-2 group-focus-within:text-primary transition-colors uppercase tracking-widest">Display Name</label>
                        <div class="relative flex items-center border-b border-glass-stroke group-focus-within:border-primary transition-all" style="padding-bottom:12px">
                            <span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors mr-3 text-[20px]">badge</span>
                            <input
                                id="input-display-name"
                                type="text"
                                maxlength="60"
                                placeholder="Your display name"
                                class="neon-input flex-1 bg-transparent text-on-surface placeholder:text-outline/50 font-body-md border-none focus:ring-0 p-0"
                            >
                        </div>
                    </div>

                    <!-- Email (read-only) -->
                    <div class="group relative">
                        <label class="block font-label-caps text-[10px] text-on-surface-variant mb-2 uppercase tracking-widest">Email Address</label>
                        <div class="relative flex items-center border-b border-glass-stroke" style="padding-bottom:12px">
                            <span class="material-symbols-outlined text-outline mr-3 text-[20px]">mail</span>
                            <input id="input-email" type="email" readonly class="flex-1 bg-transparent text-on-surface-variant font-body-md border-none focus:ring-0 p-0 cursor-default">
                        </div>
                    </div>

                    <!-- Role (read-only) -->
                    <div class="group relative">
                        <label class="block font-label-caps text-[10px] text-on-surface-variant mb-2 uppercase tracking-widest">Account Role</label>
                        <div class="relative flex items-center border-b border-glass-stroke" style="padding-bottom:12px">
                            <span class="material-symbols-outlined text-outline mr-3 text-[20px]">manage_accounts</span>
                            <input id="input-role" type="text" readonly class="flex-1 bg-transparent text-on-surface-variant font-body-md border-none focus:ring-0 p-0 cursor-default capitalize">
                        </div>
                    </div>

                    <!-- Error / success messages -->
                    <p id="profile-msg" class="text-center font-body-md text-sm" style="display:none; min-height:1.25rem"></p>

                    <!-- Save button -->
                    <button id="save-btn" onclick="saveProfile()" class="shimmer-btn w-full py-4 bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-headline-md rounded-xl shadow-lg transition-transform active:scale-95 hover:scale-[1.01]">
                        Save Changes
                    </button>

                    <!-- Divider -->
                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-glass-stroke"></div>
                        <span class="flex-shrink mx-4 text-outline font-label-caps text-[10px] uppercase">Account Actions</span>
                        <div class="flex-grow border-t border-glass-stroke"></div>
                    </div>

                    <!-- Sign Out -->
                    <button onclick="signOut()" class="w-full py-4 flex items-center justify-center gap-2 glass-panel rounded-xl border border-glass-stroke text-on-surface-variant hover:text-primary hover:border-primary/50 transition-all font-label-caps text-label-caps">
                        <span class="material-symbols-outlined text-[18px]">logout</span>
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer (exact replica of index.html footer) -->
<div id="site-footer"></div>

<!-- Toast notification -->
<div id="success-toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-panel px-8 py-4 rounded-full border border-primary/50 flex items-center space-x-3 opacity-0 translate-y-10 transition-all duration-500 pointer-events-none z-[100]">
    <span id="toast-icon" class="material-symbols-outlined text-primary">check_circle</span>
    <span id="toast-text" class="font-body-md text-primary"></span>
</div>

<script>
// ── Mobile menu toggle is handled by header-loader.js ────────────────────

// Scroll reveal
document.addEventListener('DOMContentLoaded', () => {
    const revealEls = document.querySelectorAll('.reveal');
    const observer  = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
    }, { threshold: 0.1 });
    revealEls.forEach(el => observer.observe(el));
});

// ── Auth state helpers ────────────────────────────────────────────────────
function showNavLoggedIn(user) {
    const roleLabel = user.role.charAt(0).toUpperCase() + user.role.slice(1);
    document.getElementById('desktop-user-area').style.display   = 'flex';
    document.getElementById('desktop-account-icon').style.display = 'none';
    document.getElementById('desktop-signin-link').style.display  = 'none';
    document.getElementById('desktop-user-email').textContent = user.email.split('@')[0];
    document.getElementById('desktop-user-role').textContent  = roleLabel;
    document.getElementById('mobile-user-area').style.display    = 'flex';
    document.getElementById('mobile-signout-area').style.display = 'none';
    document.getElementById('mobile-user-email').textContent = user.email;
    document.getElementById('mobile-user-role').textContent  = roleLabel;
}

async function signOut() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = 'signin.html';
}

// ── Profile load ──────────────────────────────────────────────────────────
async function loadProfile() {
    const res  = await fetch('/api/profile');
    const data = await res.json();

    if (!data.ok) {
        // Not logged in — show gate, hide card
        document.getElementById('auth-gate').style.display    = 'block';
        document.getElementById('profile-card').style.display = 'none';
        return;
    }

    const p = data.profile;
    document.getElementById('auth-gate').style.display    = 'none';
    document.getElementById('profile-card').style.display = 'block';
    // Trigger reveal animation on next frame
    requestAnimationFrame(() => {
        document.getElementById('profile-card').classList.add('active');
    });

    // Nav
    showNavLoggedIn({ email: p.email, role: p.role });

    // Avatar initial
    const initial = (p.display_name || p.email).charAt(0).toUpperCase();
    document.getElementById('avatar-initial').textContent = initial;

    // Identity
    document.getElementById('profile-display-name').textContent = p.display_name || p.email.split('@')[0];
    document.getElementById('profile-email').textContent         = p.email;

    // Role badge
    const roleLabel = p.role.charAt(0).toUpperCase() + p.role.slice(1);
    document.getElementById('profile-role-text').textContent = roleLabel;

    // Stat card — member since
    const date = new Date(p.created_at);
    const memberSince = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    document.getElementById('member-since').textContent = memberSince;

    // Form fields
    document.getElementById('input-display-name').value = p.display_name || '';
    document.getElementById('input-email').value         = p.email;
    document.getElementById('input-role').value          = roleLabel;
}

// ── Save profile ──────────────────────────────────────────────────────────
async function saveProfile() {
    const displayName = document.getElementById('input-display-name').value.trim();
    const btn         = document.getElementById('save-btn');
    const msgEl       = document.getElementById('profile-msg');

    btn.disabled = true;
    btn.style.opacity = '0.7';
    msgEl.style.display = 'none';

    const res  = await fetch('/api/profile', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ display_name: displayName }),
    });
    const data = await res.json();

    btn.disabled = false;
    btn.style.opacity = '1';

    if (!data.ok) {
        msgEl.style.color   = '#ffb4ab';
        msgEl.textContent   = data.error || 'Could not save changes.';
        msgEl.style.display = 'block';
        return;
    }

    // Update display
    const newName = data.display_name || document.getElementById('input-email').value.split('@')[0];
    document.getElementById('profile-display-name').textContent = newName;
    document.getElementById('avatar-initial').textContent        = newName.charAt(0).toUpperCase();
    document.getElementById('desktop-user-email').textContent   = document.getElementById('input-email').value.split('@')[0];

    // Toast
    showToast('Profile updated successfully.', 'check_circle', '#00dbe9');
}

function showToast(msg, icon, color) {
    const toast    = document.getElementById('success-toast');
    const toastTxt = document.getElementById('toast-text');
    const toastIco = document.getElementById('toast-icon');
    toastTxt.textContent   = msg;
    toastIco.textContent   = icon;
    toastIco.style.color   = color;
    toastTxt.style.color   = color;
    toast.style.borderColor = color + '80';
    toast.classList.remove('opacity-0', 'translate-y-10');
    toast.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-10');
    }, 3000);
}

loadProfile();
</script>
<script src="header-loader.js"></script>
  <script src="footer-loader.js"></script>
</body></html>
